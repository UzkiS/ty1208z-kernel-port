name: Three network firmware variants

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Offline build version (for example 2026.10.20-preview)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firmware-variants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      JOBS: '2'
      GOMAXPROCS: '2'
      PYTHONUNBUFFERED: '1'
      VERSION: ${{ inputs.version }}
      OUTPUT: ${{ github.workspace }}/build/firmware-variants
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install native build and offline validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang g++ gcc-13-multilib \
            g++-13-multilib bc bison flex gawk gettext git libncurses-dev \
            libssl-dev libelf-dev python3 python3-setuptools python3-venv \
            rsync swig unzip zlib1g-dev file wget curl zstd time qemu-user \
            qemu-system-arm gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf \
            libc6-dev-armhf-cross device-tree-compiler u-boot-tools cpio xz-utils \
            pkg-config fakeroot e2fsprogs shellcheck
      - name: Build shared runtime and all three network variants
        run: |
          mkdir -p logs
          bash tools/build-full-release.sh > logs/firmware-variants.log 2>&1 || {
            tail -n 100 logs/firmware-variants.log
            exit 1
          }
          tail -n 40 logs/firmware-variants.log
      - name: Upload offline firmware candidates and checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ty1208z-three-network-profiles-HARDWARE-UNTESTED-${{ github.sha }}
          path: |
            build/firmware-variants/variants/release/assets/
            build/firmware-variants/variants/manifest.json
            logs/firmware-variants.log
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
