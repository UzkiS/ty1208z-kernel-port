name: Native OpenWrt Docker fw4 and Passwall composition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'openwrt/**'
      - 'overlay/**'
      - 'tools/*openwrt*'
      - 'tools/*container*'
      - 'tools/make_initramfs.py'
      - 'tools/ntp-qemu-fixture.c'
      - 'tools/time64-probe.c'
      - 'tools/build-diagnostic.sh'
      - 'tools/generate_*'
      - 'config/busybox*'
      - 'config/sources.lock.json'
      - 'config/linux-diagnostic.fragment'
      - 'patches/0001-*'
      - 'patches/0002-*'
      - 'initramfs/container-applications-qemu-init'
      - 'Makefile'
      - '.github/workflows/openwrt-container-applications.yml'
  pull_request:
    paths:
      - 'openwrt/**'
      - 'overlay/**'
      - 'tools/*openwrt*'
      - 'tools/*container*'
      - 'tools/make_initramfs.py'
      - 'tools/ntp-qemu-fixture.c'
      - 'tools/time64-probe.c'
      - 'tools/build-diagnostic.sh'
      - 'tools/generate_*'
      - 'config/busybox*'
      - 'config/sources.lock.json'
      - 'config/linux-diagnostic.fragment'
      - 'patches/0001-*'
      - 'patches/0002-*'
      - 'initramfs/container-applications-qemu-init'
      - 'Makefile'
      - '.github/workflows/openwrt-container-applications.yml'

permissions:
  contents: read

concurrency:
  group: openwrt-container-applications-${{ github.ref }}
  cancel-in-progress: false

jobs:
  combined-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      JOBS: '2'
      GOMAXPROCS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install native build and isolated ARM QEMU dependencies
        run: |
          sudo apt-get update
          # gcc-multilib conflicts with Ubuntu's ARM cross compiler; the
          # versioned host packages retain -m32 support without that conflict.
          sudo apt-get install -y build-essential clang g++ gcc-13-multilib \
            g++-13-multilib bc bison flex gawk gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl zstd time qemu-user qemu-system-arm binutils \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libc6-dev-armhf-cross \
            libelf-dev device-tree-compiler u-boot-tools cpio xz-utils pkg-config
      - name: Build pinned static diagnostic helpers
        run: |
          mkdir -p logs
          make build > logs/container-app-helper-build.log 2>&1 || { tail -n 100 logs/container-app-helper-build.log; exit 1; }
      - name: Build pinned native GCC and musl
        run: |
          make openwrt-toolchain > logs/container-app-toolchain.log 2>&1 || { tail -n 100 logs/container-app-toolchain.log; exit 1; }
      - name: Build and test actual native Docker fw4 and both Passwall cores
        run: |
          make openwrt-container-applications > logs/container-applications.log 2>&1 || {
            tail -n 100 logs/container-applications.log
            find .work/container-applications/build -name qemu-applications-768.log -exec tail -n 100 {} \;
            exit 1
          }
          tail -n 30 logs/container-applications.log
      - name: Upload combined QEMU-only runtime and native core provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ty1208z-container-applications-QEMU-ONLY-${{ github.sha }}
          path: |
            artifacts/openwrt-container-applications-qemu/
            artifacts/openwrt-container-application-packages/
            logs/container-applications.log
            logs/container-app-helper-build.log
            logs/container-app-toolchain.log
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
