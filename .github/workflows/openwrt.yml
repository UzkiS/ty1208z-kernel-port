name: Native OpenWrt RAM bring-up

on:
  push:
    branches: [main]
    paths:
      - 'openwrt/**'
      - 'overlay/**'
      - 'patches/0001-*'
      - 'tools/*openwrt*'
      - 'tools/femac_patch.py'
      - 'tools/test_femac*.py'
      - 'tools/time64-probe.c'
      - 'tools/inspect_kernel_layout.py'
      - 'tools/inspect_images.py'
      - '.github/workflows/openwrt.yml'
  pull_request:
    paths:
      - 'openwrt/**'
      - 'overlay/**'
      - 'patches/0001-*'
      - 'tools/*openwrt*'
      - 'tools/femac_patch.py'
      - 'tools/test_femac*.py'
      - '.github/workflows/openwrt.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openwrt-ram-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-ram:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      JOBS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install native OpenWrt build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang g++ gcc-multilib \
            g++-multilib bc bison flex gawk gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl zstd time qemu-system-arm qemu-user device-tree-compiler
      - name: Build fixed source and native RAM image, then validate in QEMU
        run: |
          mkdir -p logs
          make openwrt-ram > logs/openwrt-ram.log 2>&1 || { tail -n 100 logs/openwrt-ram.log; exit 1; }
          tail -n 30 logs/openwrt-ram.log
      - name: Upload HARDWARE-UNTESTED native image and checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ty1208z-openwrt-ram-HARDWARE-UNTESTED-${{ github.sha }}
          path: |
            .work/build/openwrt-ram-*/bin/targets/hi3798mv100/
            logs/openwrt-ram.log
          retention-days: 14
          if-no-files-found: warn
      - name: Build isolated native Ethernet RAM candidate and exercise tools
        run: |
          make openwrt-net > logs/openwrt-net.log 2>&1 || { tail -n 100 logs/openwrt-net.log; exit 1; }
          tail -n 30 logs/openwrt-net.log
      - name: Upload HARDWARE-UNTESTED native Ethernet candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ty1208z-openwrt-net-HARDWARE-UNTESTED-${{ github.sha }}
          path: |
            artifacts/openwrt-net1/
            .work/ethernet/build/openwrt-ram-*/bin/targets/hi3798mv100/net/
            logs/openwrt-net.log
          retention-days: 14
          if-no-files-found: warn
