name: Diagnostic build and time64 regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JOBS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install build and lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf libc6-dev-armhf-cross bc bison flex \
            libssl-dev libelf-dev libncurses-dev device-tree-compiler \
            u-boot-tools cpio xz-utils pkg-config qemu-user qemu-system-arm \
            shellcheck python3-venv curl
          python3 -m venv .work/lint-venv
          .work/lint-venv/bin/pip install ruff==0.11.13
          .work/lint-venv/bin/pip install --require-hashes -r tools/requirements-serial.txt
          echo "$PWD/.work/lint-venv/bin" >> "$GITHUB_PATH"
      - name: Repository and script checks
        run: make lint
      - name: Capture and guarded bootloader CLI integration without board hardware
        run: make test-serial
      - name: Parse local PowerShell SSH wrapper
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/collect-baseline.ps1'),
            [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) {
            $parseErrors | Out-String | Write-Error
            exit 1
          }
      - name: Build pinned Linux and BusyBox candidate
        run: |
          mkdir -p logs
          make build > logs/build.log 2>&1 || { tail -n 100 logs/build.log; exit 1; }
          tail -n 20 logs/build.log
          git diff --exit-code -- patches
      - name: ARM time64 regression and guarded RAM boot protocol
        run: make test
      - name: Compile optional RDA USB object with separate kernel configuration
        run: |
          make wifi-usb-audit > logs/wifi-usb-audit.log 2>&1 || { tail -n 100 logs/wifi-usb-audit.log; exit 1; }
          tail -n 20 logs/wifi-usb-audit.log
          git diff --exit-code -- patches/0003-rda-usb-api-audit.patch
      - name: Build separate read-only eMMC register diagnostic and run QEMU
        run: |
          make emmc-audit > logs/emmc-audit.log 2>&1 || { tail -n 100 logs/emmc-audit.log; exit 1; }
          tail -n 20 logs/emmc-audit.log
      - name: Build separate read-only onboard SD register audit and check MMIO/RAM/QEMU gates
        run: |
          make sd-audit > logs/sd-audit.log 2>&1 || { tail -n 100 logs/sd-audit.log; exit 1; }
          tail -n 20 logs/sd-audit.log
      - name: Build restricted PIO eMMC identification and run policy/QEMU checks
        run: |
          make emmc-ident > logs/emmc-ident.log 2>&1 || { tail -n 100 logs/emmc-ident.log; exit 1; }
          tail -n 20 logs/emmc-ident.log
      - name: Build restricted SD metadata and measured restart with request/MMIO/RAM/QEMU gates
        run: |
          make sd-ident > logs/sd-ident.log 2>&1 || { tail -n 100 logs/sd-ident.log; exit 1; }
          tail -n 30 logs/sd-ident.log
      - name: Build enforced read-only SD block/filesystem profile and check queue/RO/RAM/QEMU gates
        run: |
          make sd-ro > logs/sd-ro.log 2>&1 || { tail -n 100 logs/sd-ro.log; exit 1; }
          tail -n 30 logs/sd-ro.log
      - name: Build fixed read-only eMMC samples and run request/content/QEMU checks
        run: |
          make emmc-read > logs/emmc-read.log 2>&1 || { tail -n 100 logs/emmc-read.log; exit 1; }
          tail -n 20 logs/emmc-read.log
      - name: Link optional RDA USB module and test manufacturing/key guards
        run: |
          make wifi-port > logs/wifi-port.log 2>&1 || { tail -n 100 logs/wifi-port.log; exit 1; }
          tail -n 20 logs/wifi-port.log
          git diff --exit-code -- patches/0003-rda-usb-api-audit.patch patches/0004-rda-linux-6.12-port.patch
      - name: Build inherited Ethernet audit and run protocol/profile/QEMU checks
        run: |
          make ethernet-audit > logs/ethernet-audit.log 2>&1 || { tail -n 100 logs/ethernet-audit.log; exit 1; }
          tail -n 20 logs/ethernet-audit.log
      - name: Build guarded temporary Ethernet clock/PHY-ID experiment
        run: |
          make ethernet-clock-id > logs/ethernet-clock-id.log 2>&1 || { tail -n 100 logs/ethernet-clock-id.log; exit 1; }
          tail -n 20 logs/ethernet-clock-id.log
      - name: Build inherited-PHY network candidate and run MMIO/profile/QEMU checks
        run: |
          make ethernet-net > logs/ethernet-net.log 2>&1 || { tail -n 100 logs/ethernet-net.log; exit 1; }
          tail -n 20 logs/ethernet-net.log
      - name: Compile optional USB host0 clock/PHY and generic EHCI/OHCI with sanitized SDK differential checks
        run: |
          make usb-host-compile > logs/usb-host-compile.log 2>&1 || { tail -n 100 logs/usb-host-compile.log; exit 1; }
          tail -n 25 logs/usb-host-compile.log
      - name: Build USB host0 enumeration profile and verify exact RAM plan
        run: |
          make usb-host > logs/usb-host.log 2>&1 || { tail -n 100 logs/usb-host.log; exit 1; }
          tail -n 30 logs/usb-host.log
      - name: Build read-only USB host0 register audit and run MMIO/profile/QEMU checks
        run: |
          make usb-audit > logs/usb-audit.log 2>&1 || { tail -n 100 logs/usb-audit.log; exit 1; }
          tail -n 20 logs/usb-audit.log
      - name: Build isolated SP805 explicit restart experiment and run MMIO/profile/QEMU checks
        run: |
          make restart > logs/restart.log 2>&1 || { tail -n 100 logs/restart.log; exit 1; }
          tail -n 20 logs/restart.log
      - name: Build guarded USB host0 clock/capability experiment and run MMIO/profile/QEMU checks
        run: |
          make usb-clock-audit > logs/usb-clock-audit.log 2>&1 || { tail -n 100 logs/usb-clock-audit.log; exit 1; }
          tail -n 25 logs/usb-clock-audit.log
      - name: Upload UNTESTED diagnostics and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ty1208z-diag1-HARDWARE-UNTESTED-${{ github.sha }}
          path: |
            artifacts/diag1/
            artifacts/emmc-audit1/
            artifacts/sd-audit1/
            artifacts/sd-ident1/
            artifacts/sd-ro1/
            artifacts/emmc-ident1/
            artifacts/emmc-read1/
            artifacts/ethernet-audit1/
            artifacts/ethernet-clock-id1/
            artifacts/ethernet-net1/
            artifacts/usb-audit1/
            artifacts/usb-clock-audit1/
            artifacts/usb-host-compile/
            artifacts/usb-host1/
            artifacts/restart1/
            artifacts/wifi-port/
            logs/
          retention-days: 14
          if-no-files-found: warn
