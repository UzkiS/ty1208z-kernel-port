name: Native OpenWrt application validation

on:
  push:
    branches: [main]
    paths:
      - 'openwrt/**'
      - 'patches/0001-*'
      - 'patches/0002-*'
      - 'tools/*openwrt*'
      - 'tools/build_native_router_module.py'
      - 'tools/test_sd_audit*.py'
      - 'tools/test_restart_module.py'
      - 'tools/*ram_boot*'
      - 'tools/*_profile.py'
      - 'tools/serial_cli.py'
      - 'tools/bootloader_probe.py'
      - 'tools/ymodem_sender.py'
      - 'tools/requirements-serial.txt'
      - 'tools/inspect_images.py'
      - 'tools/inspect_kernel_layout.py'
      - 'tools/time64-probe.c'
      - 'tools/ntp-qemu-fixture.c'
      - 'tools/test_xray_browser_clock.py'
      - 'tools/test_ethernet_probe_guards.py'
      - 'tools/test_native_sd_kconfig.py'
      - 'tools/test_native_emmc_kconfig.py'
      - 'tools/test_emmc_ro*.py'
      - 'tools/test_emmc_ident.py'
      - 'tools/test_emmc_handoff.py'
      - 'tools/femac_patch.py'
      - 'tools/test_femac*.py'
      - 'Makefile'
      - '.github/workflows/openwrt-applications.yml'
  pull_request:
    paths:
      - 'openwrt/**'
      - 'patches/0001-*'
      - 'patches/0002-*'
      - 'tools/*openwrt*'
      - 'tools/build_native_router_module.py'
      - 'tools/test_sd_audit*.py'
      - 'tools/test_restart_module.py'
      - 'tools/*ram_boot*'
      - 'tools/*_profile.py'
      - 'tools/serial_cli.py'
      - 'tools/bootloader_probe.py'
      - 'tools/ymodem_sender.py'
      - 'tools/requirements-serial.txt'
      - 'tools/inspect_images.py'
      - 'tools/inspect_kernel_layout.py'
      - 'tools/time64-probe.c'
      - 'tools/ntp-qemu-fixture.c'
      - 'tools/test_xray_browser_clock.py'
      - 'tools/test_ethernet_probe_guards.py'
      - 'tools/test_native_sd_kconfig.py'
      - 'tools/test_native_emmc_kconfig.py'
      - 'tools/test_emmc_ro*.py'
      - 'tools/test_emmc_ident.py'
      - 'tools/test_emmc_handoff.py'
      - 'tools/femac_patch.py'
      - 'tools/test_femac*.py'
      - 'Makefile'
      - '.github/workflows/openwrt-applications.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openwrt-applications-${{ github.ref }}
  # Preserve an expensive running native toolchain/application build. A newer
  # pending run still replaces older pending runs for the same branch.
  cancel-in-progress: false

jobs:
  applications:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: openwrt-app-ram
            source_dir: applications
            ram_dir: openwrt-apps-ram1
          - target: openwrt-router
            source_dir: router
            ram_dir: openwrt-router1
          - target: openwrt-router768
            source_dir: router768
            ram_dir: openwrt-router768
          - target: openwrt-router-sdro
            source_dir: router-sd
            ram_dir: openwrt-router-sdro
          - target: openwrt-router-emmcro
            source_dir: router-emmc
            ram_dir: openwrt-router-emmcro
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      JOBS: '2'
      GOMAXPROCS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install native build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang g++ gcc-multilib \
            g++-multilib bc bison flex gawk gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools python3-venv rsync swig unzip zlib1g-dev \
            file wget curl zstd time qemu-system-arm qemu-user device-tree-compiler u-boot-tools
          python3 -m venv .work/serial-venv
          .work/serial-venv/bin/pip install --require-hashes -r tools/requirements-serial.txt
          echo "$GITHUB_WORKSPACE/.work/serial-venv/bin" >> "$GITHUB_PATH"
      - name: Build fixed native compiler and musl
        run: |
          mkdir -p logs
          make openwrt-toolchain > logs/application-toolchain.log 2>&1 || { tail -n 100 logs/application-toolchain.log; exit 1; }
      - name: Build applications and exercise actual ARM rootfs at 2040
        run: |
          make ${{ matrix.target }} > logs/openwrt-applications.log 2>&1 || { tail -n 100 logs/openwrt-applications.log; exit 1; }
          tail -n 30 logs/openwrt-applications.log
      - name: Compile exact router RAM restart and read-only SD audit modules
        if: matrix.source_dir == 'router'
        run: |
          python3 tools/test_restart_module.py
          python3 tools/test_sd_audit.py
          python3 tools/test_sd_audit_module.py
          source_tree=$(find .work/router/build -maxdepth 1 -type d -name 'openwrt-ram-*')
          test -n "$source_tree"
          python3 tools/build_openwrt_restart_module.py --taskbase .work --source "$source_tree" > logs/native-ram-restart.log 2>&1 || { tail -n 100 logs/native-ram-restart.log; exit 1; }
          python3 tools/build_openwrt_sd_audit_module.py --taskbase .work --source "$source_tree" > logs/native-ram-sd-audit.log 2>&1 || { tail -n 100 logs/native-ram-sd-audit.log; exit 1; }
      - name: Upload exact-kernel HARDWARE-UNTESTED RAM modules
        if: always() && matrix.source_dir == 'router'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ty1208z-router-RAM-MODULES-HARDWARE-UNTESTED-${{ github.sha }}
          path: |
            artifacts/native-ram-restart/
            artifacts/native-ram-sd-audit/
            logs/native-ram-restart.log
            logs/native-ram-sd-audit.log
          retention-days: 14
          if-no-files-found: warn
      - name: Compile the exact higher-memory router restart module
        if: matrix.source_dir == 'router768'
        run: |
          python3 tools/test_restart_module.py
          source_tree=$(find .work/router768/build -maxdepth 1 -type d -name 'openwrt-ram-*')
          test -n "$source_tree"
          python3 tools/build_openwrt_restart_module.py --taskbase .work --source "$source_tree" --router-artifacts artifacts/openwrt-router768 > logs/native-router768-restart.log 2>&1 || { tail -n 100 logs/native-router768-restart.log; exit 1; }
      - name: Upload the exact higher-memory HARDWARE-UNTESTED restart module
        if: always() && matrix.source_dir == 'router768'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ty1208z-router768-RAM-MODULE-HARDWARE-UNTESTED-${{ github.sha }}
          path: |
            artifacts/native-router768-restart/
            logs/native-router768-restart.log
          retention-days: 14
          if-no-files-found: warn
      - name: Compile the exact native read-only SD router restart module
        if: matrix.source_dir == 'router-sd'
        run: |
          python3 tools/test_restart_module.py
          source_tree=$(find .work/router-sd/build -maxdepth 1 -type d -name 'openwrt-ram-*')
          test -n "$source_tree"
          python3 tools/build_openwrt_restart_module.py --taskbase .work --source "$source_tree" --router-artifacts artifacts/openwrt-router-sdro > logs/native-router-sdro-restart.log 2>&1 || { tail -n 100 logs/native-router-sdro-restart.log; exit 1; }
      - name: Upload the exact native SD HARDWARE-UNTESTED restart module
        if: always() && matrix.source_dir == 'router-sd'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ty1208z-router-sdro-RAM-MODULE-HARDWARE-UNTESTED-${{ github.sha }}
          path: |
            artifacts/native-router-sdro-restart/
            logs/native-router-sdro-restart.log
          retention-days: 14
          if-no-files-found: warn
      - name: Upload QEMU-only artifacts and checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ty1208z-${{ matrix.source_dir }}-QEMU-ONLY-${{ github.sha }}
          path: |
            .work/${{ matrix.source_dir }}/build/openwrt-ram-*/bin/targets/hi3798mv100/apps/
            .work/${{ matrix.source_dir }}/build/openwrt-ram-*/.ty1208z-application-lock.json
            .work/${{ matrix.source_dir }}/build/openwrt-ram-*/.ty1208z-application-variant.json
            .work/${{ matrix.source_dir }}/build/openwrt-ram-*/.ty1208z-toolchain.json
            logs/application-toolchain.log
            logs/openwrt-applications.log
          retention-days: 14
          if-no-files-found: warn
      - name: Upload HARDWARE-UNTESTED application RAM candidate with separate initrd
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ty1208z-${{ matrix.source_dir }}-RAM-HARDWARE-UNTESTED-${{ github.sha }}
          path: artifacts/${{ matrix.ram_dir }}/
          retention-days: 14
          if-no-files-found: warn
