name: Native OpenWrt container package compilation

on:
  workflow_dispatch:
  push:
    paths:
      - 'openwrt/containers/**'
      - 'openwrt/sources.lock.json'
      - 'openwrt/applications/sources.lock.json'
      - 'openwrt/overlay/**'
      - 'patches/0001-hi3798mv100-diagnostic.patch'
      - 'tools/prepare_openwrt*.py'
      - 'tools/build-openwrt-containers.sh'
      - 'tools/check_openwrt_containers.py'
      - '.github/workflows/openwrt-containers.yml'
  pull_request:
    paths:
      - 'openwrt/containers/**'
      - 'openwrt/sources.lock.json'
      - 'openwrt/applications/sources.lock.json'
      - 'openwrt/overlay/**'
      - 'patches/0001-hi3798mv100-diagnostic.patch'
      - 'tools/prepare_openwrt*.py'
      - 'tools/build-openwrt-containers.sh'
      - 'tools/check_openwrt_containers.py'
      - '.github/workflows/openwrt-containers.yml'

permissions:
  contents: read

concurrency:
  group: openwrt-containers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      JOBS: '2'
      GOMAXPROCS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install native build and ARM version-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang g++ gcc-multilib \
            g++-multilib bc bison flex gawk gettext git libncurses-dev \
            libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl zstd time qemu-user binutils
      - name: Build fixed native GCC and musl
        run: |
          mkdir -p logs
          make openwrt-toolchain > logs/container-toolchain.log 2>&1 || { tail -n 100 logs/container-toolchain.log; exit 1; }
      - name: Compile official container packages and verify real ARM APKs
        run: |
          make openwrt-container-packages > logs/openwrt-containers.log 2>&1 || { tail -n 100 logs/openwrt-containers.log; exit 1; }
          tail -n 30 logs/openwrt-containers.log
      - name: Upload COMPILE-ONLY packages and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ty1208z-containers-COMPILE-ONLY-${{ github.sha }}
          path: |
            artifacts/openwrt-container-packages/
            logs/container-toolchain.log
            logs/openwrt-containers.log
          retention-days: 14
          if-no-files-found: warn
